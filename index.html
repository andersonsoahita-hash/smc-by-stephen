<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b111b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SMC by Stephen">
<title>SMC by Stephen · programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#0B1220;--pn:#111C33;--pn2:#17274A;--ln:#25365A;--fg:#EAF1FF;--mu:#8FA3C8;--up:#2EBD85;--dn:#F6465D;--bl:#4C9AFF;--gd:#F0B90B;--vi:#9B8CFF;--ink:#06101F;--fd:'Sora',system-ui,sans-serif;--fb:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--fb);background-image:linear-gradient(rgba(76,154,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(76,154,255,.05) 1px,transparent 1px);background-size:44px 44px}
h1,h2,h3{font-family:var(--fd);margin:0}
button{font:600 14px var(--fb);cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--gd);color:var(--ink)}
button.g{background:var(--pn2);color:var(--fg);border:1px solid var(--ln)}button.up{background:var(--up);color:#03170F}
input,select{background:var(--pn);border:1px solid var(--ln);color:var(--fg);padding:9px 12px;border-radius:10px;font:inherit}
/* accueil */
header.top{max-width:1000px;margin:auto;padding:26px 20px 6px}header.top h1{font-size:28px}header.top h1 b{color:var(--gd)}
.sub{color:var(--mu);margin:4px 0 12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
main{max-width:1000px;margin:auto;padding:6px 20px 70px;display:grid;gap:10px}
.lv{margin-top:16px;font:700 12px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--gd)}
.lec{display:flex;gap:12px;align-items:center;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;flex-wrap:wrap}
.lec .n{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#1E3A6E,#17274A);display:grid;place-items:center;font:700 14px var(--fd);color:var(--gd)}
.lec .t{flex:1;min-width:220px}.lec small{display:block;color:var(--mu)}.lec.off{opacity:.5}.lec.ok .n{background:var(--up);color:#03170F}
.bar{height:7px;background:var(--pn2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--up));transition:width .4s}
.exam{border:1px solid var(--gd);background:linear-gradient(135deg,rgba(240,185,11,.10),transparent)}
.risk{border-left:4px solid var(--dn);background:rgba(246,70,93,.07);padding:8px 14px;border-radius:0 10px 10px 0;color:var(--mu);font-size:13px}
/* diaporama */
.dk{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:radial-gradient(1100px 600px at 85% -10%,#173764 0,var(--bg) 62%)}
.dk::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(76,154,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(76,154,255,.06) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.dk-prog{height:4px;background:var(--pn2);position:relative;z-index:2}.dk-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--up),var(--gd));transition:width .35s}
.dk-st{flex:1;overflow:auto;padding:3vh 5vw;display:flex;position:relative}
.dk-v{margin:auto;width:min(1280px,100%);animation:in .5s cubic-bezier(.2,.8,.2,1);position:relative;z-index:2}
.eye{color:var(--gd);font:700 12px var(--fd);letter-spacing:.16em;text-transform:uppercase;margin-bottom:.6em}
.dk-v h2{font-size:clamp(24px,3.6vw,40px);line-height:1.15;margin-bottom:.55em}
.dl{display:grid;grid-template-columns:1.7fr .8fr;gap:22px;align-items:center}
.dia{background:rgba(10,20,39,.75);border:1px solid var(--ln);border-radius:18px;padding:10px}.svg{width:100%;height:auto;display:block}
.side ul,.dk-v ul{padding:0;margin:0;list-style:none}
.side li,.dk-v li.b{position:relative;padding:.5em 0 .5em 1.4em;font-size:clamp(15px,1.7vw,20px)}
.side li::before,.dk-v li.b::before{content:'';position:absolute;left:0;top:1em;width:.55em;height:.55em;border-radius:2px;background:var(--gd)}
.side b,.dk-v b{color:var(--gd)}
.rv{opacity:0;transform:translateY(14px);transition:opacity .45s,transform .45s;pointer-events:none;visibility:hidden}.rv.on{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.rule{margin-top:18px;border-left:5px solid var(--gd);background:rgba(240,185,11,.09);padding:11px 18px;border-radius:0 12px 12px 0;font-size:clamp(15px,1.7vw,19px)}
.rule small{display:block;color:var(--gd);font:700 11px var(--fd);letter-spacing:.14em;margin-bottom:2px}
.rule.dn{border-color:var(--dn);background:rgba(246,70,93,.09)}.rule.dn small{color:var(--dn)}
.rule.up{border-color:var(--up);background:rgba(46,189,133,.09)}.rule.up small{color:var(--up)}
.cov h2{font-size:clamp(32px,5.4vw,60px)}.cov p{color:var(--mu);font-size:clamp(16px,2vw,22px);max-width:36em}
.chip{display:inline-block;background:var(--pn2);border:1px solid var(--ln);border-radius:99px;padding:4px 12px;margin:0 8px 8px 0;font-size:13px;color:var(--mu)}
.cvbg{position:absolute;inset:0;opacity:.30;z-index:0;pointer-events:none}.cvbg .svg{height:100%;width:100%}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cmp>div{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:14px 20px}.cmp h3{color:var(--gd);margin-bottom:.3em}
.big .n{font:700 clamp(24px,4vw,46px)/1.2 var(--fd);color:var(--gd);margin:.2em 0 .5em}.big p{color:var(--mu);font-size:clamp(16px,2vw,22px)}
table{border-collapse:collapse;width:100%;font-size:clamp(14px,1.7vw,19px)}th,td{border-bottom:1px solid var(--ln);padding:.55em .7em;text-align:left}th{color:var(--gd)}tr{animation:in .45s both}
.note{color:var(--mu);font-size:14px;margin-top:12px}
.pred{background:var(--pn);border:1px solid var(--bl);border-radius:18px;padding:20px 24px}.pred .q{font:600 clamp(18px,2.3vw,26px)/1.35 var(--fd)}
.ans{margin-top:16px;border-left:5px solid var(--up);background:rgba(46,189,133,.1);padding:12px 18px;border-radius:0 12px 12px 0;font-size:clamp(16px,1.9vw,22px)}
.ex li{position:relative;padding:.45em 0 .45em 2.3em;font-size:clamp(15px,1.7vw,20px);counter-increment:s}.ex{counter-reset:s}
.ex li::before{content:counter(s);position:absolute;left:0;top:.5em;width:1.6em;height:1.6em;border-radius:50%;background:var(--gd);color:var(--ink);display:grid;place-items:center;font:700 .8em var(--fd)}
.proof{margin-top:14px;border:1px dashed var(--gd);border-radius:14px;padding:11px 16px;color:#FFE08A}.proof small{color:var(--mu)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:18px}.calc .f{display:grid;gap:10px}.calc label{display:grid;gap:4px;color:var(--mu);font-size:13px}
.res{background:var(--pn);border:1px solid var(--up);border-radius:16px;padding:16px 20px}.res .v{font:700 clamp(28px,4vw,44px) var(--fd);color:var(--up)}
.seg{display:flex;gap:8px;margin:0 0 8px}.seg button{padding:7px 12px}.seg button.on{background:var(--gd);color:var(--ink)}
.dk-bar{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;border-top:1px solid var(--ln);background:rgba(8,14,28,.9);position:relative;z-index:3;flex-wrap:wrap}
.wmk{position:fixed;inset:-25%;pointer-events:none;display:flex;flex-wrap:wrap;gap:70px 100px;transform:rotate(-24deg);opacity:.06;font:600 20px var(--fd);z-index:4;align-content:flex-start}
.q{background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:20px 24px}.q h3{font-size:clamp(18px,2.3vw,25px);line-height:1.3;margin-bottom:12px}
.opt{display:flex;gap:12px;width:100%;text-align:left;margin:8px 0;background:var(--pn2);color:var(--fg);border:1px solid var(--ln);font-weight:500;padding:12px 16px;align-items:center}
.opt kbd{background:var(--ln);border-radius:6px;padding:1px 8px;font:700 12px var(--fd)}
.opt.ok{border-color:var(--up);background:rgba(46,189,133,.18)}.opt.ko{border-color:var(--dn);background:rgba(246,70,93,.16)}
.fb{margin-top:12px;border-radius:12px;padding:12px 16px;font-size:15px}.fb.ok{background:rgba(46,189,133,.12);border-left:4px solid var(--up)}.fb.ko{background:rgba(246,70,93,.12);border-left:4px solid var(--dn)}
.rev{margin:8px 0;padding:10px 14px;border-radius:12px;background:var(--pn);border:1px solid var(--ln);font-size:14px}
/* fiche */
.fiche{position:fixed;inset:0;z-index:70;background:rgba(5,9,18,.88);display:flex;justify-content:center;overflow:auto;padding:3vh 3vw}
.fiche .pg{background:#F7F9FD;color:#14213D;width:min(860px,100%);border-radius:14px;padding:34px 40px;height:fit-content;position:relative}
.fiche h1{font-size:28px;color:#0B1B3A}.fiche h2{font-size:19px;color:#1D4ED8;margin:22px 0 6px}.fiche p,.fiche li{font-size:16px;line-height:1.6;color:#1E2A44}.fiche .obj{background:#E8F0FF;border-left:4px solid #1D4ED8;padding:10px 14px;border-radius:0 10px 10px 0}
.fiche .pit{background:#FFF1F2;border-left:4px solid #E11D48;padding:6px 14px;border-radius:0 10px 10px 0}.fiche .keep{background:#ECFDF5;border-left:4px solid #059669;padding:6px 14px;border-radius:0 10px 10px 0}
.fiche dt{font-weight:700;color:#0B1B3A;margin-top:8px}.fiche dd{margin:0 0 4px 0}.fiche .tb{position:sticky;top:0;display:flex;gap:8px;justify-content:flex-end;margin:-10px 0 8px}
.fiche .disc{margin-top:26px;font-size:12px;color:#5B6B8C;border-top:1px solid #D5DEEF;padding-top:10px}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;color:#111;background:#fff;padding:0}#pr .wm2{position:fixed;inset:0;opacity:.07;font:600 22px sans-serif;transform:rotate(-24deg);line-height:3.2;overflow:hidden;color:#000}#pr .pg{position:relative}}
@keyframes in{from{opacity:0;transform:translateY(1.6rem) scale(.98)}to{opacity:1;transform:none}}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fd{from{opacity:0}to{opacity:1}}@keyframes pp{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}@keyframes tl{from{transform:rotate(0)}to{transform:rotate(-8deg)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr var(--t,.9s) var(--d,0s) ease forwards}
.fade{opacity:0;animation:fd .6s var(--d,0s) forwards}.pop{opacity:0;transform-box:fill-box;transform-origin:center bottom;animation:pp .5s var(--d,0s) cubic-bezier(.2,.9,.3,1.3) forwards}
.tilt{animation:tl 1.4s .5s ease forwards}
@media(max-width:820px){.dl,.cmp,.calc{grid-template-columns:1fr}.fiche .pg{padding:22px 18px}}
.brand{display:inline-flex;align-items:center;gap:10px}.brand b{font:700 22px var(--fd);letter-spacing:.04em}.brand i{font:italic 600 15px var(--fd);color:var(--gd)}.brand small{display:block;color:var(--mu);font:500 11px var(--fb);letter-spacing:.12em;text-transform:uppercase}
.hello{font:600 18px var(--fd);margin-top:8px;padding:12px 16px;border-radius:14px;background:linear-gradient(90deg,rgba(76,154,255,.18),transparent);border:1px solid var(--ln)}.hello b{color:var(--gd)}
.wlogo{position:absolute;inset:0;display:grid;place-items:center;opacity:.05;pointer-events:none;z-index:1}.wlogo svg{width:min(60vh,70vw);height:auto}
.wlogo.f{position:fixed;opacity:.07}
.term{display:grid;gap:14px;margin:6px 0 16px}.tt{font:700 clamp(34px,6vw,64px) var(--fd);color:var(--gd);line-height:1.05}
.td,.te{padding:16px 20px;border-radius:16px;font-size:clamp(17px,2vw,24px);border:1px solid var(--ln)}.td{background:var(--pn)}.te{background:rgba(76,154,255,.1);border-color:#2b4a82}
.td small,.te small{display:block;font:700 11px var(--fd);letter-spacing:.14em;color:var(--mu);margin-bottom:4px}

.sim .f{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}.sim label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
.sst{list-style:none;padding:0;margin:0;display:grid;gap:8px}.sst li{display:flex;gap:12px;align-items:center;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;font-size:clamp(15px,1.7vw,19px)}.sn{width:30px;height:30px;border-radius:50%;background:var(--gd);color:var(--ink);display:grid;place-items:center;font:700 14px var(--fd);flex:none}.gu{color:var(--up)}.gd{color:var(--dn)}
.fh{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gd);padding-bottom:10px;margin-bottom:12px;position:relative;z-index:2}.fm{display:grid;text-align:right;font-size:12px;color:var(--mu)}
.dur{float:right;font-size:12px;color:var(--mu)}.lead{font-size:1.06em;border-left:4px solid var(--bl);padding-left:12px}
.ft{width:100%;border-collapse:collapse;margin:8px 0}.ft th{background:#16305e;color:#fff;text-align:left;padding:6px 8px}.ft td{border:1px solid var(--ln);padding:6px 8px}
.fiche .wlogo.f{position:absolute;border-radius:14px;overflow:hidden}.fiche .pg>*:not(.wlogo){position:relative;z-index:2}
.fiche .ft td,.fiche .ft th{font-size:13.5px;line-height:1.45}
</style></head><body>
<header class="top"><h1>SMC <b>by Stephen</b></h1><div class="sub">Savoir · Maîtriser · Choisir — Beginner · Intermediate · Advanced · Management</div>
<div class="row"><select id="role" onchange="try{localStorage.setItem('smc_role',this.value)}catch(e){};SMC.home()"><option value="eleve">Profil : Élève</option><option value="coach">Profil : Formateur</option></select><input id="who" placeholder="Ton nom (affiché partout)" value="" oninput="try{localStorage.setItem('smc_name',this.value)}catch(e){}"><span class="sub" style="margin:0;font-size:13px">Élève : cours + sa fiche à télécharger. Formateur : en plus, fiche formateur et notes (touche P).</span></div></header>
<main id="m"></main>
<script>// SMC by Stephen — bibliothèque de schémas de trading (SVG animés)
(function(){
const C={up:'#2EBD85',dn:'#F6465D',bl:'#4C9AFF',gd:'#F0B90B',vi:'#9B8CFF',mu:'#8FA3C8',fg:'#EAF1FF',ln:'#2A3D66',pn:'#14213D'};
const svg=(s,vb='0 0 800 420')=>`<svg viewBox="${vb}" class="svg" xmlns="http://www.w3.org/2000/svg" role="img">${s}</svg>`;
const t=(x,y,s,o={})=>`<text x="${x}" y="${y}" fill="${o.c||C.fg}" font-size="${o.s||16}" text-anchor="${o.a||'middle'}" font-weight="${o.w||600}" class="fade" style="--d:${o.d||0}s">${s}</text>`;
const ln=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||C.ln}" stroke-width="${o.w||2}" ${o.dash?`stroke-dasharray="${o.dash}" class="fade"`:'pathLength="1" class="draw"'} style="--d:${o.d||0}s"/>`;
const path=(d,o={})=>`<path d="${d}" fill="none" stroke="${o.c||C.fg}" stroke-width="${o.w||3}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--d:${o.d||0}s;--t:${o.t||1.1}s" ${o.mk?`marker-end="url(#ar${o.mk})"`:''}/>`;
const box=(x,y,w,h,f,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r??10}" fill="${f}" ${o.s?`stroke="${o.s}" stroke-width="2"`:''} opacity="${o.op||1}" class="pop" style="--d:${o.d||0}s"/>`;
const defs=`<defs>${[['up',C.up],['dn',C.dn],['gd',C.gd],['bl',C.bl]].map(([k,c])=>`<marker id="ar${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join('')}</defs>`;
const mkY=(min,max,top,bot)=>v=>bot-(v-min)/(max-min)*(bot-top);
function cd(x,o,h,l,c,y,w=22,d=0){const up=c>=o,col=up?C.up:C.dn;return `<g class="pop" style="--d:${d}s"><line x1="${x}" x2="${x}" y1="${y(h)}" y2="${y(l)}" stroke="${col}" stroke-width="3"/><rect x="${x-w/2}" y="${y(Math.max(o,c))}" width="${w}" height="${Math.max(2,Math.abs(y(o)-y(c)))}" rx="2" fill="${col}"/></g>`}
const series=(a,x0,dx,y,d0=0,st=.18,w=22)=>a.map((k,i)=>cd(x0+i*dx,k[0],k[1],k[2],k[3],y,w,d0+i*st)).join('');
const grid=(x1,y1,x2,y2,n=5)=>Array.from({length:n},(_,i)=>`<line x1="${x1}" x2="${x2}" y1="${y1+(y2-y1)*i/(n-1)}" y2="${y1+(y2-y1)*i/(n-1)}" stroke="${C.ln}" stroke-width="1" opacity=".5"/>`).join('');
const D={};

D.week=()=>{const days=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];return svg(defs+days.map((d,i)=>{const on=i<5;return box(50+i*105,120,92,150,on?'#14325A':'#1A2036',{s:on?C.bl:C.ln,d:i*.12})+t(96+i*105,170,d,{s:20,c:on?C.fg:C.mu,d:i*.12})+t(96+i*105,215,on?'24 h':'fermé',{s:on?26:16,c:on?C.up:C.mu,w:700,d:i*.12+.2})}).join('')+t(400,70,'Le Forex : ouvert 24 h sur 24, du lundi au vendredi',{s:22})+t(400,330,'Quand une place ferme (Tokyo), une autre ouvre (Londres, puis New York)',{c:C.mu,s:16,d:1})+t(400,375,'Week-end : le marché des devises est fermé',{c:C.gd,s:16,d:1.3}))};

D.flow=(a)=>{const noA=a[0]==='-';if(noA)a=a.slice(1);const n=a.length,w=Math.min(190,720/n-30),gap=(720-n*w)/(n-1||1);return svg(defs+a.map((x,i)=>{const X=40+i*(w+gap);return box(X,150,w,110,x[1]||'#14325A',{s:x[2]||C.bl,d:i*.35})+t(X+w/2,200,x[0],{s:17,d:i*.35+.1})+(x[3]?t(X+w/2,228,x[3],{s:13,c:C.mu,w:500,d:i*.35+.2}):'')+(i<n-1&&!noA?path(`M${X+w+6} 205 L${X+w+gap-8} 205`,{c:C.gd,mk:'gd',d:i*.35+.3,t:.5}):'')}).join(''))};

D.pairs=()=>svg(defs+t(400,70,'EUR / USD = 1,0800',{s:46,w:700})+
 box(110,110,210,70,'#14325A',{s:C.bl,d:.4})+t(215,138,'EUR · devise de BASE',{s:17,d:.5})+t(215,162,'ce que tu achètes / vends',{s:13,c:C.mu,w:500,d:.6})+path('M215 108 L330 82',{c:C.bl,w:2,d:.5,t:.5})+
 box(480,110,210,70,'#3A1B2A',{s:C.dn,d:.8})+t(585,138,'USD · devise de COTATION',{s:17,d:.9})+t(585,162,'combien ça coûte',{s:13,c:C.mu,w:500,d:1})+path('M585 108 L470 82',{c:C.dn,w:2,d:.9,t:.5})+
 box(240,235,320,64,'#16263F',{s:C.gd,d:1.3})+t(400,263,'1 euro vaut 1,0800 dollar',{s:20,c:C.gd,d:1.4})+t(400,286,'si le prix monte → l’euro se renforce',{s:13,c:C.mu,w:500,d:1.6})+
