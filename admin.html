/* ---- historique (événements métier, distinct du journal des actions admin) ---- */
R.his=v=>{const ev=[];(D.certs||[]).forEach(c=>ev.push({t:c.t,i:'🎓',k:'Certificat',x:`${c.name} — ${LVN[c.lv]||c.lv}, note ${c.score} %`,test:c.test}));(D.pays||[]).forEach(p=>ev.push({t:p.t,i:'🧾',k:'Paiement',x:`${p.name||p.email} — ${p.amount||p.amt||''} ${p.id||''}`,test:p.test}));D.users.forEach(u=>{if(u.t0||u.created)ev.push({t:u.t0||u.created,i:'👤',k:u.role==='coach'?'Formateur inscrit':'Inscription',x:`${u.name} (${u.email})`,test:u.test})});(D.reqs||[]).forEach(r=>ev.push({t:r.t,i:'🔓',k:'Demande de niveau',x:`${r.email} — ${(r.lv||[]).join(', ')||r.lv||''}`}));ev.sort((x,y)=>y.t-x.t);v.innerHTML=`<div class="card"><h3>Historique des événements</h3><small>Inscriptions, paiements, demandes de niveau et certificats lancés. Le Journal, lui, garde les actions techniques de l’administration.</small><div class="sc"><table class="tb">${ev.slice(0,400).map(e=>`<tr><td>${fmt(e.t)}</td><td>${e.i} ${e.k}${e.test?' <span class="tag y">test</span>':''}</td><td>${esc(e.x)}</td></tr>`).join('')||'<tr><td><small>Rien pour l’instant.</small></td></tr>'}</table></div></div>`};
/* ---- journal ---- */
R.jou=v=>{v.innerHTML=`<div class="g2"><div class="card"><h3>Actions</h3><div class="sc"><table class="tb">${D.log.map(x=>`<tr><td>${fmt(x.t)}</td><td>${esc(x.act)}<small>${esc(x.target)} ${esc(x.info)}</small></td></tr>`).join('')}</table></div></div><div class="card"><h3>E-mails envoyés</h3><div class="sc"><table class="tb">${D.mails.map(x=>`<tr><td>${fmt(x.t)}</td><td>${esc(x.subject)}<small>${esc(x.to)} · ${esc(x.status)}</small></td></tr>`).join('')||'<tr><td><small>Aucun envoi.</small></td></tr>'}</table></div></div></div>`};
/* ---- démarrage ---- */
window.addEventListener('DOMContentLoaded',async()=>{if(KEY){const r=await api('adminAll');if(r.ok){D=r.data;return shell()}}loginView()});
})();

/* afficher / masquer le mot de passe */
(function(){function f(i){if(i.dataset.eye)return;i.dataset.eye=1;const w=document.createElement('span');w.className='eyew';i.parentNode.insertBefore(w,i);w.appendChild(i);const b=document.createElement('button');b.type='button';b.className='pweye';b.textContent='👁';b.setAttribute('aria-label','Afficher le mot de passe');b.onclick=()=>{const s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'🙈':'👁'};w.appendChild(b)}const run=()=>document.querySelectorAll('input[type=password]:not([data-eye])').forEach(f);new MutationObserver(run).observe(document.documentElement,{childList:true,subtree:true});run()})();

/* fond marché (admin) */
(function(){function mk(){if(document.getElementById('bgx')||!document.body)return;let r=5,n=64,v=0,s='',W=1600,st=W/n;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280};for(let k=0;k<n;k++){const o=v;v+=(rnd()-.45)*46;const cl=v,hi=Math.max(o,cl)+rnd()*22,lo=Math.min(o,cl)-rnd()*22,col=cl>=o?'#2EBD85':'#F6465D',x=k*st;s+=`<path d="M${(x+st*.3).toFixed(1)} ${(560-hi).toFixed(1)}V${(560-lo).toFixed(1)}" stroke="${col}" stroke-width="2"/><rect x="${x.toFixed(1)}" y="${(560-Math.max(o,cl)).toFixed(1)}" width="${(st*.55).toFixed(1)}" height="${Math.max(3,Math.abs(cl-o)).toFixed(1)}" fill="${col}"/>`}const d=document.createElement('div');d.id='bgx';d.style.cssText='position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 600px at 105% 15%,rgba(246,70,93,.16),transparent 60%),radial-gradient(800px 600px at -5% 100%,rgba(46,189,133,.12),transparent 60%)';d.innerHTML=`<svg width="100%" height="100%" viewBox="0 0 ${W} 900" preserveAspectRatio="xMidYMax slice" style="opacity:.14;position:absolute;inset:0"><g transform="translate(0,60)">${s}</g></svg>`;document.body.insertBefore(d,document.body.firstChild)}new MutationObserver(mk).observe(document.documentElement,{childList:true,subtree:true});if(document.body)mk();else document.addEventListener('DOMContentLoaded',mk)})();
</script></html>
