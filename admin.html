</style></head><body></body><script>(function(){
const API_URL='https://script.google.com/macros/s/AKfycbz60gRpTUKl8y5n3PUDGp4oowr-bOwLmawrS0SLI9UF1RYwQ3vh3L6EGI08LnXsYH0/exec';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LSg=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}},LSs=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};

const LOGO=z=>`<svg width="${z}" height="${z}" viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C9AFF"/><stop offset="1" stop-color="#F0B90B"/></linearGradient></defs><path d="M32 3 57 17.500v29L32 61 7 46.500v-29z" fill="#0B1220" stroke="url(#lg)" stroke-width="3"/><g stroke-width="3" stroke-linecap="round"><path d="M20 20v24" stroke="#F6465D"/><rect x="16" y="26" width="8" height="12" fill="#F6465D" stroke="none"/><path d="M32 14v34" stroke="#2EBD85"/><rect x="28" y="20" width="8" height="18" fill="#2EBD85" stroke="none"/><path d="M44 16v28" stroke="#2EBD85"/><rect x="40" y="18" width="8" height="12" fill="#2EBD85" stroke="none"/></g></svg>`;
let D=null,V='dash',KEY=LSg('smc_akey'),Q='',FL='all';
async function api(action,data){try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action,akey:KEY},data||{}))});return await r.json()}catch(e){return{ok:false,err:'Connexion impossible.'}}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function modal(h){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="mc"><button class="x g">✕</button>${h}</div>`;document.body.appendChild(d);d.onclick=e=>{if(e.target===d||e.target.classList.contains('x'))d.remove()};return d}
/* ---- données dérivées ---- */

const reste=u=>Math.max(0,(u.total||0)-paid(u.email));

/* ---- écran de connexion ---- */
function loginView(err){document.body.innerHTML=`<div class="lg"><div class="lgc">${LOGO(64)}<h1>SMC <i>by Stephen</i></h1><p>Console administrateur</p><label>CLÉ ADMIN<input id="k" type="password" autocomplete="off"></label><div class="err">${esc(err||'')}</div><button id="go" class="pri">Entrer</button><small>La clé est envoyée par email quand tu lances « nouvelleCleAdmin » dans Apps Script.</small></div></div>`;
 const go=async()=>{KEY=$('#k').value.trim();if(!KEY)return;const r=await api('adminAll');if(!r.ok){KEY='';return loginView(r.err)}LSs('smc_akey',KEY);D=r.data;shell()};$('#go').onclick=go;$('#k').onkeydown=e=>{if(e.key==='Enter')go()}}
/* ---- coque ---- */
const NAV=[['dash','Tableau de bord','▦'],['dem','Demandes','✉'],['el','Élèves','👥'],['pay','Paiements & reçus','🧾'],['rel','Relances','📣'],['tre','Trésorerie','💰'],['for','Formateurs','🎙'],['pro','Promotions & présences','📅'],['reg','Réglages & tarifs','⚙'],['jou','Journal','🛡']];
function shell(){const n=pend().length;document.body.innerHTML=`<div class="app"><aside><div class="brand">${LOGO(40)}<div><b>SMC Gestion</b><small>BY STEPHEN</small></div></div><nav>${NAV.map(x=>`<button data-v="${x[0]}" class="${V===x[0]?'on':''}"><span>${x[2]}</span>${x[1]}${x[0]==='dem'&&n?`<em>${n}</em>`:''}</button>`).join('')}</nav><button class="out g" id="out">Quitter</button></aside><main><div class="top"><div><h1 id="ttl"></h1><small id="sub"></small></div><div class="acts"><button class="g" id="rf">↻ Actualiser</button></div></div><div id="v"></div></main></div>`;
 $$('nav button').forEach(b=>b.onclick=()=>{V=b.dataset.v;Q='';FL='all';shell()});$('#out').onclick=()=>{LSs('smc_akey','');KEY='';loginView()};$('#rf').onclick=reload;render()}
async function reload(){const r=await api('adminAll');if(!r.ok){toast(r.err);return}D=r.data;shell();toast('Données à jour')}
function render(){const t=NAV.find(x=>x[0]===V);$('#ttl').textContent=t[1];$('#sub').textContent=({dash:'Vue d’ensemble en direct',dem:'Valide ou refuse : l’accès part par email',el:'Suivi des formés',pay:'Encaissements et reçus numérotés',rel:'E-mails prêts à envoyer',tre:'Encaissements, dépenses et solde',for:'Équipe pédagogique',pro:'Cohortes et appel',reg:'Tarifs, site, notifications',jou:'Actions sensibles et envois'})[V];R[V]($('#v'))}
const R={};
/* ---- tableau de bord ---- */
R.dash=v=>{const enc=D.pays.reduce((a,p)=>a+p.amount,0),due=stu().filter(u=>u.status==='active').reduce((a,u)=>a+reste(u),0),inac=actifs().filter(u=>!u.seen||Date.now()-u.seen>7*864e5),exp=actifs().filter(u=>u.until&&u.until-Date.now()<7*864e5&&u.until>Date.now()),solde=D.pays.reduce((a,p)=>a+p.amount,0)-D.exp.reduce((a,x)=>a+x.amount,0);
 v.innerHTML=`<div class="kp"><div class="k b"><small>FORMÉS ACTIFS</small><b>${actifs().length}</b><span>${stu().length} élèves au total</span></div><div class="k y"><small>DEMANDES EN ATTENTE</small><b>${pend().length}</b><span>à valider</span></div><div class="k b"><small>ENCAISSÉ</small><b>${ar(enc)}</b><span>${D.pays.length} reçus</span></div><div class="k r"><small>RESTE À ENCAISSER</small><b>${ar(due)}</b><span>${actifs().filter(u=>reste(u)>0).length} formé(s)</span></div></div>
 <div class="g2"><div class="card"><h3>Dernières demandes</h3>${D.users.filter(u=>u.status==='pending'||u.created).sort((a,b)=>b.created-a.created).slice(0,6).map(u=>`<div class="row2"><div><b>${esc(u.name)}</b><small>${esc(u.email)} · ${fd(u.created)}</small></div>${stt(u)}</div>`).join('')||'<small>Aucune demande.</small>'}<button class="g" data-go="dem">Tout voir</button></div>
 <div class="card"><h3>À surveiller</h3>${pend().length?`<div class="row2"><span class="tag y">${pend().length}</span> demande(s) à valider</div>`:''}${actifs().filter(u=>reste(u)>0).length?`<div class="row2"><span class="tag r">${actifs().filter(u=>reste(u)>0).length}</span> formé(s) avec un solde à régler <button class="g" data-go="rel">Relancer</button></div>`:''}${inac.length?`<div class="row2"><span class="tag">${inac.length}</span> sans connexion depuis 7 j</div>`:''}${exp.length?`<div class="row2"><span class="tag y">${exp.length}</span> accès qui expirent bientôt</div>`:''}${!pend().length&&!inac.length&&!exp.length&&!actifs().filter(u=>reste(u)>0).length?'<small>Rien à signaler.</small>':''}<h3 style="margin-top:14px">Trésorerie</h3><div class="big">${ar(solde)}</div><small>encaissé moins dépenses</small></div></div>
 <div class="card"><h3>Progression des formés</h3><table class="tb"><tr><th>Formé</th><th>Niveaux</th><th>Leçons faites</th><th>Dernière connexion</th></tr>${actifs().slice(0,10).map(u=>{const n=Object.keys(u.done||{}).filter(k=>!/^EX_/.test(k)).length;return`<tr><td>${esc(u.name)}</td><td>${(u.lv||[]).join(' ')}</td><td><div class="pb"><i style="width:${Math.min(100,n/72*100)}%"></i></div>${n}/72</td><td>${ago(u.seen)}</td></tr>`}).join('')||'<tr><td colspan=4><small>Aucun formé actif.</small></td></tr>'}</table></div>`;
 $$('[data-go]',v).forEach(b=>b.onclick=()=>{V=b.dataset.go;shell()})};
/* ---- demandes ---- */
R.dem=v=>{const p=pend().sort((a,b)=>b.created-a.created),tr=cf('t_BG');
 v.innerHTML=`<div class="card"><h3>Lien d’inscription à envoyer</h3><code>${esc(D.site)}</code> <button class="g" id="cl">Copier</button><small>Chaque formateur a aussi son lien personnel (onglet Formateurs). Les demandes arrivent ici, tu valides, l’accès part par email.</small></div>
 <h2>En attente (${p.length})</h2>${p.map(u=>`<div class="card req"><div class="rh"><div><b>${esc(u.name)}</b> <span class="tag">${u.want==='coach'?'formateur':'élève'}</span><small>${esc(u.email)} · ${esc(u.tel)} · ${esc(u.act||'activité non précisée')} · ${esc(u.age)} ans<br>Demande du ${fmt(u.created)}${u.coach?' · via '+esc(coachName(u.coach)):''}</small></div></div>
 <div class="grid"><label>Rôle<select data-f="role"><option value="student" ${u.want!=='coach'?'selected':''}>Élève</option><option value="coach" ${u.want==='coach'?'selected':''}>Formateur</option></select></label><label>Formateur<select data-f="coach"><option value="">—</option>${coaches().map(c=>`<option value="${c.email}" ${u.coach===c.email?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Total à payer (Ar)<input data-f="total" type="number" value="${tr||''}"></label><label>Durée d’accès (jours, vide = illimité)<input data-f="days" type="number"></label></div>
 <div class="chips">${LVS.map(l=>`<label class="ck"><input type="checkbox" class="lv" value="${l}" ${l==='BG'?'checked':''}> ${LVN[l]}</label>`).join('')}</div>
 <div class="acts"><button data-ap="${esc(u.email)}">✔ Valider et envoyer l’accès</button><button class="g" data-rf="${esc(u.email)}">Refuser</button></div></div>`).join('')||'<div class="card"><small>Aucune demande en attente.</small></div>'}`;
 $('#cl',v).onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(D.site);toast('Lien copié')};
 $$('[data-ap]',v).forEach(b=>b.onclick=async()=>{const c=b.closest('.req'),g=f=>$(`[data-f=${f}]`,c).value,body={email:b.dataset.ap,role:g('role'),coach:g('coach'),total:g('total'),lv:$$('.lv:checked',c).map(x=>x.value)};if(g('days'))body.days=+g('days');b.disabled=true;const r=await api('userApprove',body);if(!r.ok){toast(r.err);b.disabled=false;return}await reload();modal(`<h3>Accès envoyé ✅</h3><p>Email ${esc(r.data.mail)}.<br>Si le mail n’arrive pas, donne-lui ces informations :</p><p><b>Identifiant :</b> ${esc(body.email)}<br><b>Mot de passe provisoire :</b> <code>${esc(r.data.pwd)}</code></p>`)});
 $$('[data-rf]',v).forEach(b=>b.onclick=async()=>{if(!confirm('Refuser cette demande ?'))return;await api('userRefuse',{email:b.dataset.rf,notify:confirm('Lui envoyer un email de refus poli ?')});reload()})};
const cf=k=>(D.cfg||{})[k]||'';
/* ---- élèves ---- */
R.el=v=>{let L=D.users.filter(u=>u.role==='student'&&u.status!=='pending'&&u.status!=='refused');if(Q)L=L.filter(u=>(u.name+u.email+u.tel).toLowerCase().includes(Q.toLowerCase()));
 if(FL==='due')L=L.filter(u=>reste(u)>0);if(FL==='off')L=L.filter(u=>u.status==='blocked'||(u.until&&u.until<Date.now()));if(FL==='inactive')L=L.filter(u=>!u.seen||Date.now()-u.seen>7*864e5);
 v.innerHTML=`<div class="bar"><input id="q" placeholder="Chercher un nom, un email…" value="${esc(Q)}"><div class="chips">${[['all','Tous'],['due','Solde à régler'],['inactive','Inactifs 7 j'],['off','Coupés / expirés']].map(x=>`<button class="${FL===x[0]?'':'g'}" data-fl="${x[0]}">${x[1]}</button>`).join('')}</div><button id="nw">+ Nouveau compte</button></div>
 <div class="card"><div class="sc"><table class="tb"><tr><th>Formé</th><th>Statut</th><th>Niveaux</th><th>Payé / Reste</th><th>Connexion</th><th>Appareil</th><th></th></tr>${L.map(u=>`<tr><td><b>${esc(u.name)}</b><small>${esc(u.email)}<br>${esc(u.tel)}</small></td><td>${stt(u)}${u.until?`<small>jusqu’au ${fd(u.until)}</small>`:''}</td><td>${(u.lv||[]).join(' ')}</td><td>${ar(paid(u.email))}<br><small class="${reste(u)?'red':''}">reste ${ar(reste(u))}</small></td><td>${ago(u.seen)}</td><td>${u.device?'lié':'—'}</td><td class="act">${u.status==='blocked'?`<button data-a="on" data-e="${esc(u.email)}">Rétablir</button>`:`<button class="g" data-a="off" data-e="${esc(u.email)}">Couper</button>`}<button class="g" data-a="p7" data-e="${esc(u.email)}">+7 j</button><button class="g" data-a="dev" data-e="${esc(u.email)}">Libérer l’appareil</button><button class="g" data-a="ed" data-e="${esc(u.email)}">Gérer</button></td></tr>`).join('')||'<tr><td colspan=7><small>Aucun résultat.</small></td></tr>'}</table></div></div>`;
 $('#q',v).oninput=e=>{Q=e.target.value;const p=e.target.selectionStart;R.el(v);const i=$('#q');i.focus();i.setSelectionRange(p,p)};$$('[data-fl]',v).forEach(b=>b.onclick=()=>{FL=b.dataset.fl;R.el(v)});
 $('#nw',v).onclick=newAcc;
 $$('[data-a]',v).forEach(b=>b.onclick=async()=>{const e=b.dataset.e,u=D.users.find(x=>x.email===e),a=b.dataset.a;let r;
  if(a==='off'){if(!confirm('Couper l’accès de '+u.name+' ?'))return;r=await api('userSet',{email:e,patch:{status:'blocked'}})}
  else if(a==='on')r=await api('userSet',{email:e,patch:{status:'active',until:0}});
  else if(a==='p7')r=await api('userSet',{email:e,patch:{status:'active',until:Math.max(u.until||0,Date.now())+7*864e5}});
  else if(a==='dev')r=await api('userSet',{email:e,patch:{device:''}});
  else return edit(u);
  if(r.ok){await reload();toast('Fait')}else toast(r.err)})};
function newAcc(){const d=modal(`<h3>Nouveau compte</h3><p><small>L’accès est envoyé tout de suite par email.</small></p><div class="grid"><label>Nom<input id="n1"></label><label>Email<input id="n2" type="email"></label><label>Téléphone<input id="n3"></label><label>Rôle<select id="n4"><option value="student">Élève</option><option value="coach">Formateur</option></select></label><label>Total à payer (Ar)<input id="n5" type="number" value="${cf('t_BG')}"></label></div><button id="ng">Créer et envoyer l’accès</button>`);
 $('#ng',d).onclick=async()=>{const r=await api('userCreate',{name:$('#n1',d).value,email:$('#n2',d).value,tel:$('#n3',d).value,role:$('#n4',d).value,total:$('#n5',d).value});if(!r.ok)return toast(r.err);d.remove();await reload();modal(`<h3>Compte créé ✅</h3><p>Email ${esc(r.data.mail)}.<br>Mot de passe provisoire : <code>${esc(r.data.pwd)}</code></p>`)}}
function edit(u){const ls=[];const d=modal(`<h3>${esc(u.name)}</h3><small>${esc(u.email)} · ${esc(u.tel)}</small><p><b>Niveaux ouverts</b></p><div class="chips">${LVS.map(l=>`<label class="ck"><input type="checkbox" class="el" value="${l}" ${(u.lv||[]).includes(l)?'checked':''}> ${LVN[l]}</label>`).join('')}</div>
 <div class="grid"><label>Formateur<select id="e1"><option value="">—</option>${coaches().map(c=>`<option value="${c.email}" ${u.coach===c.email?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Promotion<select id="e2"><option value="">—</option>${D.cohorts.map(c=>`<option value="${c.id}" ${u.cohort===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Total à payer (Ar)<input id="e3" type="number" value="${u.total||0}"></label><label>Accès jusqu’au<input id="e4" type="date" value="${u.until?new Date(u.until).toISOString().slice(0,10):''}"></label></div>
 <label>Note privée<input id="e5" value="${esc(u.note)}"></label>
 <p><b>Leçons précises</b> <small>ouvertes : ${(u.open||[]).join(', ')||'—'} · bloquées : ${(u.blk||[]).join(', ')||'—'}</small></p><div class="grid"><input id="e6" placeholder="ex. IM3 (code de la leçon)"><span><button class="g" data-l="o">Ouvrir</button> <button class="g" data-l="b">Bloquer</button> <button class="g" data-l="n">Normal</button></span></div>
 <div class="acts"><button id="es">Enregistrer</button><button class="g" id="er">Renvoyer un accès (nouveau mot de passe)</button></div>`);
 const patch=p=>api('userSet',{email:u.email,patch:p}).then(async r=>{if(!r.ok)return toast(r.err);d.remove();await reload()});
 $('#es',d).onclick=()=>patch({lv:$$('.el:checked',d).map(x=>x.value),coach:$('#e1',d).value,cohort:$('#e2',d).value,total:+$('#e3',d).value||0,until:$('#e4',d).value?new Date($('#e4',d).value+'T23:59:59').getTime():0,note:$('#e5',d).value});
 $$('[data-l]',d).forEach(b=>b.onclick=()=>{const id=$('#e6',d).value.trim().toUpperCase();if(!id)return;const o=(u.open||[]).filter(x=>x!==id),k=(u.blk||[]).filter(x=>x!==id),t=b.dataset.l;patch({open:t==='o'?[...o,id]:o,blk:t==='b'?[...k,id]:k})});
 $('#er',d).onclick=async()=>{if(!confirm('Envoyer un nouveau mot de passe provisoire à '+u.name+' ?'))return;const r=await api('pwdReset',{email:u.email});d.remove();toast(r.ok?'Accès renvoyé ('+r.data.mail+')':r.err)}}
/* ---- paiements ---- */
function receipt(p){const w=window.open('','_blank');if(!w)return;w.document.write(`<title>Reçu ${p.id}</title><body style="font-family:sans-serif;max-width:560px;margin:30px auto;color:#111"><div style="display:flex;gap:12px;align-items:center">${LOGO(44)}<div><h2 style="margin:0">SMC by Stephen</h2><small>Savoir · Maîtriser · Choisir</small></div></div><hr><h3>Reçu n° ${p.id}</h3><p>Date : ${fmt(p.t)}</p><p>Reçu de : <b>${esc(p.name)}</b></p><p>Montant : <b>${ar(p.amount)}</b></p><p>Mode : ${esc(p.method)} ${p.ref?'· Réf. '+esc(p.ref):''}</p><p>Objet : accès ${(p.lv||[]).map(l=>LVN[l]).join(', ')||'formation'}</p><hr><small>Formation éducative — aucune promesse de gain.</small><script>setTimeout(()=>print(),300)<\/script>`);w.document.close()}
R.pay=v=>{const ps=D.pays.slice().sort((a,b)=>b.t-a.t);
 v.innerHTML=`<div class="card"><h3>Enregistrer un paiement</h3><div class="grid"><label>Formé<select id="p1">${stu().filter(u=>u.status==='active').map(u=>`<option value="${esc(u.email)}">${esc(u.name)} — reste ${ar(reste(u))}</option>`).join('')}</select></label><label>Montant (Ar)<input id="p2" type="number"></label><label>Mode<select id="p3"><option>MVola</option><option>Orange Money</option><option>Airtel Money</option><option>Espèces</option></select></label><label>Référence<input id="p4" placeholder="n° de transaction"></label></div><div class="chips">Niveaux débloqués : ${LVS.map(l=>`<label class="ck"><input type="checkbox" class="pl" value="${l}"> ${LVN[l]}${cf('t_'+l)?' ('+ar(cf('t_'+l))+')':''}</label>`).join('')}</div><button id="pa">Enregistrer et générer le reçu</button></div>
 <div class="card"><div class="sc"><table class="tb"><tr><th>N°</th><th>Date</th><th>Formé</th><th>Montant</th><th>Mode</th><th></th></tr>${ps.map(p=>`<tr><td>${p.id}</td><td>${fmt(p.t)}</td><td>${esc(p.name)}</td><td>${ar(p.amount)}</td><td>${esc(p.method)}</td><td><button class="g" data-r="${p.id}">Reçu</button></td></tr>`).join('')||'<tr><td colspan=6><small>Aucun paiement.</small></td></tr>'}</table></div></div>`;
 $('#pa',v).onclick=async()=>{const r=await api('payAdd',{email:$('#p1').value,amount:$('#p2').value,method:$('#p3').value,ref:$('#p4').value,lv:$$('.pl:checked').map(x=>x.value)});if(!r.ok)return toast(r.err);receipt(r.data.pay);reload()};
 $$('[data-r]',v).forEach(b=>b.onclick=()=>receipt(ps.find(p=>p.id===b.dataset.r)))};
/* ---- relances ---- */
const TPL={due:['Rappel de paiement — SMC by Stephen','Bonjour {{prenom}},\n\nUn petit rappel : il reste {{reste}} à régler pour ta formation SMC by Stephen. Tu peux payer par MVola, Orange Money, Airtel Money ou en espèces, et ton reçu te sera remis.\n\nMerci de me confirmer ton paiement dès que c’est fait.\n\nStephen — SMC by Stephen'],
 inactive:['On ne t’a pas vu depuis un moment','Bonjour {{prenom}},\n\nTu ne t’es pas connecté(e) à SMC by Stephen depuis quelques jours. La régularité fait toute la différence : reprends là où tu t’es arrêté(e) :\n{{site}}\n\nSi tu rencontres un problème, réponds simplement à ce message.\n\nStephen — SMC by Stephen'],
 expire:['Ton accès arrive à échéance','Bonjour {{prenom}},\n\nTon accès à SMC by Stephen arrive bientôt à échéance. Pour le prolonger, contacte-moi.\n\nStephen — SMC by Stephen'],
 welcome:['Bienvenue dans SMC by Stephen','Bonjour {{prenom}},\n\nBienvenue ! Connecte-toi ici : {{site}}\nPense à compléter ton profil et à suivre les cours dans l’ordre. Rappel : le trading comporte un risque de perte, la formation est éducative et ne promet aucun gain.\n\nStephen — SMC by Stephen'],
 free:['','']};
let RT='due',RS={};
R.rel=v=>{const pick=t=>t==='due'?actifs().filter(u=>reste(u)>0):t==='inactive'?actifs().filter(u=>!u.seen||Date.now()-u.seen>7*864e5):t==='expire'?actifs().filter(u=>u.until&&u.until-Date.now()<7*864e5):actifs(),L=pick(RT),T=TPL[RT];
 v.innerHTML=`<div class="chips">${[['due','Solde à régler'],['inactive','Inactifs'],['expire','Accès qui expire'],['welcome','Bienvenue'],['free','Message libre']].map(x=>`<button class="${RT===x[0]?'':'g'}" data-t="${x[0]}">${x[1]}</button>`).join('')}</div>
 <div class="g2"><div class="card"><h3>Destinataires (${L.length})</h3>${L.map(u=>`<label class="ck row2"><span><input type="checkbox" class="rc" value="${esc(u.email)}" checked> <b>${esc(u.name)}</b><small>${esc(u.email)}${reste(u)?' · reste '+ar(reste(u)):''}</small></span></label>`).join('')||'<small>Personne dans cette catégorie.</small>'}</div>
 <div class="card"><h3>Message</h3><label>Objet<input id="ms" value="${esc(T[0])}"></label><label>Corps<textarea id="mb" rows="11">${esc(T[1])}</textarea></label><small>Champs automatiques : {{prenom}} {{reste}} {{site}}</small><div class="acts"><button id="sd">Envoyer</button></div><small>Limite d’envoi Gmail : environ 100 e-mails par jour.</small></div></div>`;
 $$('[data-t]',v).forEach(b=>b.onclick=()=>{RT=b.dataset.t;R.rel(v)});
 $('#sd',v).onclick=async()=>{const em=$$('.rc:checked').map(x=>x.value);if(!em.length)return toast('Aucun destinataire');if(!confirm('Envoyer à '+em.length+' personne(s) ?'))return;const s=$('#ms').value,b=$('#mb').value;
  const items=em.map(e=>{const u=D.users.find(x=>x.email===e),f=t=>t.replace(/{{prenom}}/g,u.name.split(' ')[0]).replace(/{{reste}}/g,ar(reste(u))).replace(/{{site}}/g,D.site);return{to:e,subject:f(s),body:f(b)}});
  const r=await api('mailBatch',{items,tag:RT});toast(r.ok?r.data.filter(x=>x.s==='envoyé').length+' e-mail(s) envoyé(s)':r.err);reload()}};
/* ---- trésorerie ---- */
R.tre=v=>{const inn=D.pays.reduce((a,p)=>a+p.amount,0),out=D.exp.reduce((a,x)=>a+x.amount,0),mo={},md={};D.pays.forEach(p=>{const k=new Date(p.t).toISOString().slice(0,7);mo[k]=(mo[k]||0)+p.amount;md[p.method]=(md[p.method]||0)+p.amount});const ks=Object.keys(mo).sort().slice(-6),mx=Math.max(1,...ks.map(k=>mo[k]));
 v.innerHTML=`<div class="kp"><div class="k b"><small>ENCAISSÉ</small><b>${ar(inn)}</b></div><div class="k r"><small>DÉPENSES</small><b>${ar(out)}</b></div><div class="k y"><small>SOLDE</small><b>${ar(inn-out)}</b></div><div class="k b"><small>RESTE À ENCAISSER</small><b>${ar(actifs().reduce((a,u)=>a+reste(u),0))}</b></div></div>
 <div class="g2"><div class="card"><h3>Encaissements par mois</h3>${ks.map(k=>`<div class="bar2"><span>${k}</span><i style="width:${mo[k]/mx*100}%"></i><b>${ar(mo[k])}</b></div>`).join('')||'<small>Rien pour l’instant.</small>'}<h3 style="margin-top:14px">Par mode de paiement</h3>${Object.keys(md).map(k=>`<div class="row2"><span>${esc(k)}</span><b>${ar(md[k])}</b></div>`).join('')}</div>
 <div class="card"><h3>Dépenses</h3><div class="grid"><label>Libellé<input id="x1"></label><label>Montant (Ar)<input id="x2" type="number"></label><label>Catégorie<select id="x3"><option>Publicité</option><option>Outils / abonnements</option><option>Formateur</option><option>Salle / connexion</option><option>Autre</option></select></label></div><button id="xa">Ajouter</button>${D.exp.slice().sort((a,b)=>b.t-a.t).map(x=>`<div class="row2"><span><b>${esc(x.label)}</b><small>${fd(x.t)} · ${esc(x.cat)}</small></span><span>${ar(x.amount)} <button class="g" data-x="${x.id}">✕</button></span></div>`).join('')}</div></div>`;
 $('#xa',v).onclick=async()=>{const r=await api('expAdd',{label:$('#x1').value,amount:$('#x2').value,cat:$('#x3').value});r.ok?reload():toast(r.err)};$$('[data-x]',v).forEach(b=>b.onclick=async()=>{await api('expDel',{id:b.dataset.x});reload()})};
/* ---- formateurs ---- */
R.for=v=>{v.innerHTML=`<div class="bar"><span></span><button id="nc">+ Nouveau formateur</button></div><div class="card"><table class="tb"><tr><th>Formateur</th><th>Code / lien</th><th>Élèves</th><th></th></tr>${coaches().map(c=>`<tr><td><b>${esc(c.name)}</b><small>${esc(c.email)}</small></td><td><code>${esc(c.code)}</code><small>${esc(D.site)}?c=${esc(c.code)}</small></td><td>${stu().filter(u=>u.coach===c.email).length}</td><td class="act"><button class="g" data-cp="${esc(c.code)}">Copier le lien</button><button class="g" data-rs="${esc(c.email)}">Renvoyer l’accès</button></td></tr>`).join('')||'<tr><td colspan=4><small>Aucun formateur. Valide une demande « formateur » ou crée-en un.</small></td></tr>'}</table></div>`;
 $('#nc',v).onclick=()=>{newAcc();setTimeout(()=>{const s=$('#n4');if(s)s.value='coach'},0)};
 $$('[data-cp]',v).forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(D.site+'?c='+b.dataset.cp);toast('Lien copié')});$$('[data-rs]',v).forEach(b=>b.onclick=async()=>{const r=await api('pwdReset',{email:b.dataset.rs});toast(r.ok?'Accès renvoyé':r.err)})};
/* ---- promotions ---- */
R.pro=v=>{v.innerHTML=`<div class="card"><h3>Nouvelle promotion</h3><div class="grid"><label>Nom<input id="h1" placeholder="Promotion 1"></label><label>Début<input id="h2" type="date"></label></div><button id="hs">Créer</button></div><div class="card"><h3>Appel</h3><div class="grid"><label>Promotion<select id="a1">${D.cohorts.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>Date<input id="a2" type="date" value="${new Date().toISOString().slice(0,10)}"></label></div><div id="al"></div><button id="as">Enregistrer l’appel</button></div>`;
 $('#hs',v).onclick=async()=>{if($('#h1').value){await api('cohortSave',{name:$('#h1').value,start:$('#h2').value});reload()}};
 const lst=()=>{const c=$('#a1').value,cur=D.att.find(x=>x.cohort===c&&x.date===$('#a2').value),mem=stu().filter(u=>u.cohort===c);$('#al').innerHTML=mem.length?mem.map(u=>`<label class="ck"><input type="checkbox" class="pr" value="${esc(u.email)}" ${cur&&cur.present.includes(u.email)?'checked':''}> ${esc(u.name)}</label>`).join(''):'<small>Aucun formé dans cette promotion (affecte-les depuis Élèves › Gérer).</small>'};
 if(D.cohorts.length){$('#a1').onchange=lst;$('#a2').onchange=lst;lst()}
 $('#as',v).onclick=async()=>{const r=await api('attendSave',{cohort:$('#a1').value,date:$('#a2').value,present:$$('.pr:checked').map(x=>x.value)});toast(r.ok?'Appel enregistré':r.err)}};
/* ---- réglages ---- */
R.reg=v=>{v.innerHTML=`<div class="card"><h3>Tarifs par niveau (Ariary)</h3><div class="grid">${LVS.map(l=>`<label>${LVN[l]}<input data-c="t_${l}" type="number" value="${cf('t_'+l)}"></label>`).join('')}</div></div><div class="card"><h3>Site et notifications</h3><div class="grid"><label>Adresse du site des formés<input data-c="site" value="${esc(D.site)}"></label><label>Email prévenu des nouvelles demandes<input data-c="notify" type="email" value="${esc(cf('notify'))}"></label></div><button id="sv">Enregistrer</button></div><div class="card"><h3>Sécurité</h3><small>Pour changer la clé admin : dans Apps Script, lance la fonction « nouvelleCleAdmin ». L’ancienne clé cesse de fonctionner.</small></div>`;
 $('#sv',v).onclick=async()=>{const o={};$$('[data-c]').forEach(i=>o[i.dataset.c]=i.value);const r=await api('cfgSet',{v:o});r.ok?reload():toast(r.err)}};
/* ---- journal ---- */
R.jou=v=>{v.innerHTML=`<div class="g2"><div class="card"><h3>Actions</h3><div class="sc"><table class="tb">${D.log.map(x=>`<tr><td>${fmt(x.t)}</td><td>${esc(x.act)}<small>${esc(x.target)} ${esc(x.info)}</small></td></tr>`).join('')}</table></div></div><div class="card"><h3>E-mails envoyés</h3><div class="sc"><table class="tb">${D.mails.map(x=>`<tr><td>${fmt(x.t)}</td><td>${esc(x.subject)}<small>${esc(x.to)} · ${esc(x.status)}</small></td></tr>`).join('')||'<tr><td><small>Aucun envoi.</small></td></tr>'}</table></div></div></div>`};
/* ---- démarrage ---- */
window.addEventListener('DOMContentLoaded',async()=>{if(KEY){const r=await api('adminAll');if(r.ok){D=r.data;return shell()}}loginView()});
})();
</script></html>
